[package]
name = "ambient-status-dashboard-tauri"
version = "0.1.0"
description = "Tauri presentation shell for Ambient Status Dashboard"
edition = "2024"

[lib]
name = "ambient_status_dashboard_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ambient-status-dashboard-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3.23"
